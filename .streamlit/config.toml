# 注意: このファイルは Streamlit Community Cloud でも読まれる。
# server.address / server.port / server.headless はクラウド側が自分で決めるため、
# ここに書くと待ち受けに失敗してデプロイが起動しない。ローカル限定の設定は
# コミットせず、起動時のフラグか環境変数で渡すこと。
#   例: streamlit run app.py --server.address localhost

[browser]
gatherUsageStats = false

[theme]
base = "light"
primaryColor = "#4F46E5"
